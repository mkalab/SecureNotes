openapi: 3.0.3
info:
  title: SecureNotes API
  version: 0.2.0
  description: |
    Current implemented API contract for the P0-P8 application, written from
    the project roadmap and verified against the ASP.NET Core controllers.
    No API contract was supplied separately. Future roadmap endpoints are
    intentionally omitted until they are implemented. All state-changing
    /api requests require an allowed Origin and X-CSRF-TOKEN header. Session
    cookies are backed by server-side 256-bit random IDs; only their SHA-256
    hashes are stored in SQL Server.
servers:
  - url: /
tags:
  - name: System
  - name: Authentication
  - name: Notes
  - name: Attachments
  - name: Categories
  - name: Two-factor authentication
  - name: Administration
paths:
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check API availability
      responses:
        "200":
          description: The API process is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Check API and database readiness
      responses:
        "200":
          description: SQL Server and the required stored procedure are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Issue the antiforgery cookie and request token
      responses:
        "200":
          description: A request token was issued
          headers:
            Set-Cookie:
              description: HttpOnly antiforgery cookie; secure cookie settings vary by environment
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
  /api/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register an account and sign in
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and authenticated
          headers:
            Set-Cookie:
              description: HttpOnly authentication cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The authentication request rate limit was exceeded
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in with email and password
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: HttpOnly authentication cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "202":
          description: Password accepted; complete TOTP or use one recovery code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorRequired"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Email or password is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The authentication request rate limit was exceeded
  /api/auth/google:
    get:
      tags: [Authentication]
      operationId: beginGoogleLogin
      summary: Start Google OpenID Connect login
      description: Redirects to Google using Authorization Code with PKCE. The returnUrl must be a local application path. If OAuth configuration is absent, redirects back to the application with an unavailable status.
      parameters:
        - name: returnUrl
          in: query
          required: false
          description: Local path to return to after authentication; external URLs are ignored.
          schema:
            type: string
            maxLength: 2048
      responses:
        "302":
          description: Redirect to Google or the local application when Google login is not configured
          headers:
            Location:
              schema:
                type: string
        "429":
          description: The authentication request rate limit was exceeded
  /api/auth/google/link:
    post:
      tags: [Authentication]
      operationId: linkGoogleAccount
      summary: Re-authenticate with password and link a Google identity
      description: Requires an authenticated password account, current password, same-origin request, and CSRF token. The Google identity is verified through OIDC and is linked only to the current account.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/GoogleLinkRequest"
      responses:
        "302":
          description: Redirect to Google or return to the application with a generic failure status
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/CsrfFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: The authentication request rate limit was exceeded
  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Return the current account, if signed in
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "204":
          description: No account is signed in
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Sign out and clear the authentication cookie
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/CsrfFailure"
  /api/notes:
    get:
      tags: [Notes]
      operationId: listNotes
      summary: List the current user's notes
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          description: Search note titles and content
          schema:
            type: string
            maxLength: 200
        - name: categoryId
          in: query
          description: Filter by an owned category ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notes returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Notes]
      operationId: createNote
      summary: Create a note for the current user
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteWriteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The selected category or parent note is not owned by the current user
  /api/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Notes]
      operationId: getNote
      summary: Get a note owned by the current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Note returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{id}/update:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Notes]
      operationId: updateNote
      summary: Update a note owned by the current user
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteWriteRequest"
      responses:
        "200":
          description: Updated note returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Notes]
      operationId: deleteNote
      summary: Delete a note owned by the current user
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Note deleted
        "400":
          $ref: "#/components/responses/CsrfFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{id}/items:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Notes]
      operationId: listNoteItems
      summary: List checklist items of an owned note
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Checklist items returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Notes]
      operationId: createNoteItem
      summary: Add a checklist item to an owned note
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteItemWriteRequest"
      responses:
        "201":
          description: Checklist item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{id}/items/{itemId}/update:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [Notes]
      operationId: updateNoteItem
      summary: Update an item on an owned note
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteItemWriteRequest"
      responses:
        "200":
          description: Updated checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{id}/items/{itemId}/delete:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [Notes]
      operationId: deleteNoteItem
      summary: Delete an item from an owned note
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Checklist item deleted
        "400":
          $ref: "#/components/responses/CsrfFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{noteId}/attachments:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      tags: [Attachments]
      operationId: listNoteAttachments
      summary: List attachments of a note owned by the current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Attachments returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteAttachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Attachments are disabled by server configuration
    post:
      tags: [Attachments]
      operationId: uploadNoteAttachment
      summary: Upload a validated and encrypted attachment to an owned note
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Attachment validated, stored encrypted, and returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteAttachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Origin validation failed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Per-note attachment count or per-user quota exceeded
        "413":
          description: File or upload request exceeds the configured size limit
        "429":
          description: Upload rate limit exceeded
        "503":
          description: Attachments are disabled by server configuration
  /api/notes/{noteId}/attachments/{attachmentId}/download:
    parameters:
      - $ref: "#/components/parameters/NoteId"
      - $ref: "#/components/parameters/AttachmentId"
    get:
      tags: [Attachments]
      operationId: downloadNoteAttachment
      summary: Download an attachment owned by the current user
      description: Returns a decrypted attachment with Content-Disposition attachment; PDF is never rendered inline.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Attachment bytes
          headers:
            Content-Disposition:
              description: Safe attachment filename
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Attachments are disabled by server configuration
  /api/notes/{noteId}/attachments/{attachmentId}/delete:
    parameters:
      - $ref: "#/components/parameters/NoteId"
      - $ref: "#/components/parameters/AttachmentId"
    post:
      tags: [Attachments]
      operationId: deleteNoteAttachment
      summary: Delete an attachment from an owned note
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Attachment metadata and encrypted file deleted
        "400":
          $ref: "#/components/responses/CsrfFailure"
        "403":
          description: Origin validation failed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Attachments are disabled by server configuration
  /api/notes/{noteId}/shares:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      tags: [Notes]
      operationId: listNoteShares
      summary: List share-link metadata for a note owned by the current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Share metadata without bearer tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteShare"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Sharing is disabled by server configuration
    post:
      tags: [Notes]
      operationId: createNoteShare
      summary: Create a short-lived view or edit share link
      description: The 32-byte random bearer token is returned once and never stored in plaintext.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteShareRequest"
      responses:
        "201":
          description: Share link created; save the returned token now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedNoteShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Origin validation failed
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Sharing is disabled by server configuration
  /api/notes/{noteId}/shares/{shareId}/revoke:
    parameters:
      - $ref: "#/components/parameters/NoteId"
      - $ref: "#/components/parameters/ShareId"
    post:
      tags: [Notes]
      operationId: revokeNoteShare
      summary: Revoke a share link for a note owned by the current user
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Share link revoked
        "400":
          $ref: "#/components/responses/CsrfFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Origin validation failed
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Sharing is disabled by server configuration
  /api/shared/{token}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    get:
      tags: [Notes]
      operationId: getSharedNote
      summary: Read a note through an active share link
      description: Returns only plain text note fields. Invalid, expired, and revoked tokens all return 404.
      responses:
        "200":
          description: Shared note content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedNote"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Shared-link request rate limit exceeded
        "503":
          description: Sharing is disabled by server configuration
  /api/shared/{token}/attachments:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    get:
      tags: [Notes]
      operationId: listSharedNoteAttachments
      summary: List attachments belonging to the shared note
      responses:
        "200":
          description: Attachments belonging to this note only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteAttachment"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Shared-link request rate limit exceeded
  /api/shared/{token}/attachments/{attachmentId}/download:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
      - $ref: "#/components/parameters/AttachmentId"
    get:
      tags: [Notes]
      operationId: downloadSharedNoteAttachment
      summary: Download an attachment belonging to the shared note
      description: The attachment is checked against the share's note ID and is always returned as a download.
      responses:
        "200":
          description: Attachment bytes
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Shared-link request rate limit exceeded
  /api/shared/{token}/update:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    post:
      tags: [Notes]
      operationId: updateSharedNoteText
      summary: Update only title and content through an edit link
      description: Requires an authenticated application session and CSRF token. Attachments and other note metadata cannot be changed.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedNoteUpdateRequest"
      responses:
        "200":
          description: Updated shared text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Origin validation failed
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Shared-link request rate limit exceeded
        "503":
          description: Sharing is disabled by server configuration
  /api/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories owned by the current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Categories returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a category for the current user
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWriteRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/categories/{id}/update:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Categories]
      operationId: updateCategory
      summary: Rename a category owned by the current user
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWriteRequest"
      responses:
        "200":
          description: Updated category returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/categories/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete a category owned by the current user
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Category deleted; associated notes become uncategorized
        "400":
          $ref: "#/components/responses/CsrfFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/2fa:
    get:
      tags: [Two-factor authentication]
      operationId: getTwoFactorStatus
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Whether TOTP is enabled for the current account
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/2fa/enroll:
    post:
      tags: [Two-factor authentication]
      operationId: enrollTwoFactor
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: One-time TOTP secret and authenticator URI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorEnrollment"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/2fa/enable:
    post:
      tags: [Two-factor authentication]
      operationId: enableTwoFactor
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
      responses:
        "200":
          description: Two-factor enabled; recovery codes are returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/2fa/disable:
    post:
      tags: [Two-factor authentication]
      operationId: disableTwoFactor
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
      responses:
        "204":
          description: Two-factor disabled after valid TOTP proof
        "409":
          description: Invalid/replayed code or an administrator attempting to disable required 2FA
  /api/auth/2fa/verify:
    post:
      tags: [Two-factor authentication]
      operationId: verifyTwoFactorLogin
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
      responses:
        "200":
          description: Second factor accepted and an application session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: The second-factor rate limit was exceeded
  /api/console-4d91/users:
    get:
      tags: [Administration]
      operationId: adminListUsers
      security:
        - sessionCookie: []
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: User account metadata without credentials or note content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin role and a TOTP-verified session are required
  /api/console-4d91/users/{userId}/lock:
    post:
      tags: [Administration]
      operationId: adminLockUser
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Account locked and all its sessions revoked
        "404":
          $ref: "#/components/responses/NotFound"
  /api/console-4d91/users/{userId}/unlock:
    post:
      tags: [Administration]
      operationId: adminUnlockUser
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Account unlocked and failed-login counters reset
        "404":
          $ref: "#/components/responses/NotFound"
  /api/console-4d91/users/{userId}/sessions/revoke:
    post:
      tags: [Administration]
      operationId: adminRevokeUserSessions
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Number of active sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revokedSessions:
                    type: integer
  /api/console-4d91/audit:
    get:
      tags: [Administration]
      operationId: adminListAudit
      security:
        - sessionCookie: []
      parameters:
        - name: beforeId
          in: query
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Most recent append-only audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAuditEntry"
  /api/console-4d91/shares:
    get:
      tags: [Administration]
      operationId: adminListShares
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Share metadata without bearer tokens or note content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminShare"
  /api/console-4d91/shares/{shareId}/revoke:
    post:
      tags: [Administration]
      operationId: adminRevokeShare
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
      responses:
        "204":
          description: Share link revoked
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-SecureNotes
      description: |
        Production cookie name. Development uses SecureNotes.Dev because the
        local Docker Compose frontend is served over HTTP. The cookie is
        HttpOnly and SameSite=Strict in both environments. Session IDs contain
        256 random bits, have 20-minute idle and 8-hour absolute timeouts, and
        only their SHA-256 hashes are stored server-side. A second login
        invalidates the first session for that account.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Request token returned by GET /api/csrf; send the cookie from that response too.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Note or category GUID, depending on the operation
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      description: Checklist item GUID
      schema:
        type: string
        format: uuid
    NoteId:
      name: noteId
      in: path
      required: true
      description: Note GUID
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: Attachment GUID
      schema:
        type: string
        format: uuid
    ShareId:
      name: shareId
      in: path
      required: true
      description: Share-link identifier
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: User account identifier
      schema:
        type: string
        format: uuid
    ShareToken:
      name: token
      in: path
      required: true
      description: 32-byte random base64url bearer token
      schema:
        type: string
        minLength: 43
        maxLength: 43
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, unavailable]
    CsrfTokenResponse:
      type: object
      required: [requestToken]
      properties:
        requestToken:
          type: string
    AccountResponse:
      type: object
      required: [userId, email, role]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
    TwoFactorRequired:
      type: object
      required: [requiresTwoFactor]
      properties:
        requiresTwoFactor:
          type: boolean
          enum: [true]
    TwoFactorCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 32
          description: A current TOTP code or unused recovery code.
    TwoFactorEnrollment:
      type: object
      required: [secret, authenticatorUri]
      properties:
        secret:
          type: string
          description: Base32 TOTP secret; display only during enrollment.
        authenticatorUri:
          type: string
          format: uri
          description: otpauth URI to import into an authenticator application.
    RecoveryCodesResponse:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    AdminUser:
      type: object
      required: [userId, email, role, isDisabled, failedCount, twoFactorEnabled, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        isDisabled:
          type: boolean
        failedCount:
          type: integer
        lockedUntil:
          type: string
          format: date-time
          nullable: true
        twoFactorEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    AdminAuditEntry:
      type: object
      required: [auditLogId, action, createdAt]
      properties:
        auditLogId:
          type: integer
          format: int64
        userId:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        action:
          type: string
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    AdminShare:
      type: object
      required: [shareId, noteId, userId, email, permission, expiresAt, createdAt]
      properties:
        shareId:
          type: string
          format: uuid
        noteId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        permission:
          type: string
          enum: [view, edit]
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{12,128}$"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    GoogleLinkRequest:
      type: object
      required: [Password]
      properties:
        Password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    Note:
      type: object
      required:
        - noteId
        - userId
        - title
        - content
        - color
        - importance
        - isPinned
        - position
        - createdAt
        - updatedAt
        - itemCount
      properties:
        noteId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        categoryName:
          type: string
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
          maxLength: 20000
        sourceUrl:
          type: string
          format: uri
          nullable: true
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        importance:
          type: integer
          minimum: 0
          maximum: 4
        isPinned:
          type: boolean
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        itemCount:
          type: integer
          minimum: 0
    NoteWriteRequest:
      type: object
      required: [title, content, color]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          maxLength: 20000
        categoryId:
          type: string
          format: uuid
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
        sourceUrl:
          type: string
          maxLength: 2048
          description: Optional absolute URL; only HTTP and HTTPS schemes are accepted.
          nullable: true
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        importance:
          type: integer
          minimum: 0
          maximum: 4
        isPinned:
          type: boolean
        position:
          type: integer
    NoteItem:
      type: object
      required: [noteItemId, noteId, title, position, isCompleted, createdAt]
      properties:
        noteItemId:
          type: string
          format: uuid
        noteId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 1000
        position:
          type: integer
        isCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NoteItemWriteRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 1000
        isCompleted:
          type: boolean
    NoteAttachment:
      type: object
      required: [attachmentId, noteId, fileName, contentType, sizeBytes, createdAt]
      properties:
        attachmentId:
          type: string
          format: uuid
        noteId:
          type: string
          format: uuid
        fileName:
          type: string
          maxLength: 255
        contentType:
          type: string
          enum: [application/pdf, text/plain, text/markdown, image/png, image/jpeg]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
    NoteShare:
      type: object
      required: [shareId, permission, expiresAt, isExpired, createdAt]
      properties:
        shareId:
          type: string
          format: uuid
        permission:
          type: string
          enum: [view, edit]
        expiresAt:
          type: string
          format: date-time
        isExpired:
          type: boolean
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateNoteShareRequest:
      type: object
      required: [permission]
      properties:
        permission:
          type: string
          enum: [view, edit]
        expiresInHours:
          type: integer
          description: 1 to 720 hours; omitted or zero defaults to 24 hours
          minimum: 1
          maximum: 720
          default: 24
    CreatedNoteShare:
      type: object
      required: [shareId, token, permission, expiresAt]
      properties:
        shareId:
          type: string
          format: uuid
        token:
          type: string
          minLength: 43
          maxLength: 43
        permission:
          type: string
          enum: [view, edit]
        expiresAt:
          type: string
          format: date-time
    SharedNote:
      type: object
      required: [title, content, permission, expiresAt]
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
          maxLength: 20000
        permission:
          type: string
          enum: [view, edit]
        expiresAt:
          type: string
          format: date-time
    SharedNoteUpdateRequest:
      type: object
      required: [title, content]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          maxLength: 20000
    Category:
      type: object
      required: [categoryId, name, createdAt]
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        createdAt:
          type: string
          format: date-time
        noteCount:
          type: integer
          minimum: 0
    CategoryWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationProblem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    BadRequest:
      description: Invalid input, URL scheme, or request validation failure
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/ValidationProblem"
    CsrfFailure:
      description: A valid antiforgery cookie and X-CSRF-TOKEN header are required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required
    NotFound:
      description: Resource not found or not owned by the current user
