openapi: 3.0.3
info:
  title: SecureNotes API
  version: 0.2.0
  description: |
    Current implemented API contract for the P0-P5 application, written from
    the project roadmap and verified against the ASP.NET Core controllers.
    No API contract was supplied separately. Future roadmap endpoints are
    intentionally omitted until they are implemented. All state-changing
    /api requests require an allowed Origin and X-CSRF-TOKEN header. Session
    cookies are backed by server-side 256-bit random IDs; only their SHA-256
    hashes are stored in SQL Server.
servers:
  - url: /
tags:
  - name: System
  - name: Authentication
  - name: Notes
  - name: Categories
paths:
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check API availability
      responses:
        "200":
          description: The API process is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Check API and database readiness
      responses:
        "200":
          description: SQL Server and the required stored procedure are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Issue the antiforgery cookie and request token
      responses:
        "200":
          description: A request token was issued
          headers:
            Set-Cookie:
              description: HttpOnly antiforgery cookie; secure cookie settings vary by environment
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
  /api/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register an account and sign in
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and authenticated
          headers:
            Set-Cookie:
              description: HttpOnly authentication cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The authentication request rate limit was exceeded
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in with email and password
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: HttpOnly authentication cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Email or password is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The authentication request rate limit was exceeded
  /api/auth/google:
    get:
      tags: [Authentication]
      operationId: beginGoogleLogin
      summary: Start Google OpenID Connect login
      description: Redirects to Google using Authorization Code with PKCE. The returnUrl must be a local application path. If OAuth configuration is absent, redirects back to the application with an unavailable status.
      parameters:
        - name: returnUrl
          in: query
          required: false
          description: Local path to return to after authentication; external URLs are ignored.
          schema:
            type: string
            maxLength: 2048
      responses:
        "302":
          description: Redirect to Google or the local application when Google login is not configured
          headers:
            Location:
              schema:
                type: string
        "429":
          description: The authentication request rate limit was exceeded
  /api/auth/google/link:
    post:
      tags: [Authentication]
      operationId: linkGoogleAccount
      summary: Re-authenticate with password and link a Google identity
      description: Requires an authenticated password account, current password, same-origin request, and CSRF token. The Google identity is verified through OIDC and is linked only to the current account.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/GoogleLinkRequest"
      responses:
        "302":
          description: Redirect to Google or return to the application with a generic failure status
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/CsrfFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: The authentication request rate limit was exceeded
  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Return the current account, if signed in
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "204":
          description: No account is signed in
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Sign out and clear the authentication cookie
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/CsrfFailure"
  /api/notes:
    get:
      tags: [Notes]
      operationId: listNotes
      summary: List the current user's notes
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          description: Search note titles and content
          schema:
            type: string
            maxLength: 200
        - name: categoryId
          in: query
          description: Filter by an owned category ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notes returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Notes]
      operationId: createNote
      summary: Create a note for the current user
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteWriteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The selected category or parent note is not owned by the current user
  /api/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Notes]
      operationId: getNote
      summary: Get a note owned by the current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Note returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{id}/update:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Notes]
      operationId: updateNote
      summary: Update a note owned by the current user
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteWriteRequest"
      responses:
        "200":
          description: Updated note returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Notes]
      operationId: deleteNote
      summary: Delete a note owned by the current user
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Note deleted
        "400":
          $ref: "#/components/responses/CsrfFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{id}/items:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Notes]
      operationId: listNoteItems
      summary: List checklist items of an owned note
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Checklist items returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Notes]
      operationId: createNoteItem
      summary: Add a checklist item to an owned note
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteItemWriteRequest"
      responses:
        "201":
          description: Checklist item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{id}/items/{itemId}/update:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [Notes]
      operationId: updateNoteItem
      summary: Update an item on an owned note
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteItemWriteRequest"
      responses:
        "200":
          description: Updated checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notes/{id}/items/{itemId}/delete:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [Notes]
      operationId: deleteNoteItem
      summary: Delete an item from an owned note
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Checklist item deleted
        "400":
          $ref: "#/components/responses/CsrfFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories owned by the current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Categories returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a category for the current user
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWriteRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/categories/{id}/update:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Categories]
      operationId: updateCategory
      summary: Rename a category owned by the current user
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWriteRequest"
      responses:
        "200":
          description: Updated category returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/categories/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete a category owned by the current user
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Category deleted; associated notes become uncategorized
        "400":
          $ref: "#/components/responses/CsrfFailure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-SecureNotes
      description: |
        Production cookie name. Development uses SecureNotes.Dev because the
        local Docker Compose frontend is served over HTTP. The cookie is
        HttpOnly and SameSite=Strict in both environments. Session IDs contain
        256 random bits, have 20-minute idle and 8-hour absolute timeouts, and
        only their SHA-256 hashes are stored server-side. A second login
        invalidates the first session for that account.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Request token returned by GET /api/csrf; send the cookie from that response too.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Note or category GUID, depending on the operation
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      description: Checklist item GUID
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, unavailable]
    CsrfTokenResponse:
      type: object
      required: [requestToken]
      properties:
        requestToken:
          type: string
    AccountResponse:
      type: object
      required: [userId, email]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{12,128}$"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    GoogleLinkRequest:
      type: object
      required: [Password]
      properties:
        Password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    Note:
      type: object
      required:
        - noteId
        - userId
        - title
        - content
        - color
        - importance
        - isPinned
        - position
        - createdAt
        - updatedAt
        - itemCount
      properties:
        noteId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        categoryName:
          type: string
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
          maxLength: 20000
        sourceUrl:
          type: string
          format: uri
          nullable: true
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        importance:
          type: integer
          minimum: 0
          maximum: 4
        isPinned:
          type: boolean
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        itemCount:
          type: integer
          minimum: 0
    NoteWriteRequest:
      type: object
      required: [title, content, color]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          maxLength: 20000
        categoryId:
          type: string
          format: uuid
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
        sourceUrl:
          type: string
          maxLength: 2048
          description: Optional absolute URL; only HTTP and HTTPS schemes are accepted.
          nullable: true
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        importance:
          type: integer
          minimum: 0
          maximum: 4
        isPinned:
          type: boolean
        position:
          type: integer
    NoteItem:
      type: object
      required: [noteItemId, noteId, title, position, isCompleted, createdAt]
      properties:
        noteItemId:
          type: string
          format: uuid
        noteId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 1000
        position:
          type: integer
        isCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NoteItemWriteRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 1000
        isCompleted:
          type: boolean
    Category:
      type: object
      required: [categoryId, name, createdAt]
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        createdAt:
          type: string
          format: date-time
        noteCount:
          type: integer
          minimum: 0
    CategoryWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationProblem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    BadRequest:
      description: Invalid input, URL scheme, or request validation failure
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/ValidationProblem"
    CsrfFailure:
      description: A valid antiforgery cookie and X-CSRF-TOKEN header are required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required
    NotFound:
      description: Resource not found or not owned by the current user
